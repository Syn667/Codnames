<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Rounded Gold Background Badge -->
  <rect width="100" height="100" rx="26" fill="#F59E0B" />
  
  <!-- Minimalist Cod Fish Silhouette -->
  <!-- Streamlined fish body pointing right -->
  <path
    d="M 18 50 
       C 24 34, 46 34, 68 40 
       C 80 43, 88 50, 88 50 
       C 88 50, 80 57, 68 60 
       C 46 66, 24 66, 18 50 Z"
    fill="#0F172A"
  />
  
  <!-- Top Fin (Single clean dorsal fin) -->
  <path d="M 40 35 C 48 24, 62 26, 64 39 Z" fill="#0F172A" />
  
  <!-- Tail Fin (Crisp geometric tail) -->
  <polygon points="20,50 6,32 10,50 6,68" fill="#0F172A" />
  
  <!-- Iconic Chin Whisker / Barbel -->
  <path d="M 80 54 Q 82 63, 78 65" stroke="#0F172A" stroke-width="3" stroke-linecap="round" fill="none" />
  
  <!-- Bold Spy Sunglasses -->
  <polygon points="62,44 82,43 78,54 65,54" fill="#020617" stroke="#F59E0B" stroke-width="1.5" />
  <line x1="68" y1="46" x2="76" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
