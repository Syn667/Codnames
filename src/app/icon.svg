  <!-- Sunglasses -->
  <polygon points="68,44 86,43 83,53 72,54" fill="#020617" stroke="#F59E0B" stroke-width="1.5" />
  <line x1="68" y1="45" x2="64" y2="45" stroke="#F59E0B" stroke-width="1.5" />
  <line x1="73" y1="46" x2="79" y2="46" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.9" />
  
  <!-- Bowtie Accent -->
